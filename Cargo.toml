[workspace]
resolver = "2"
members = ["crates/kami-core", "crates/kami-cli", "apps/desktop/src-tauri"]
default-members = ["crates/kami-core", "crates/kami-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kokoro-ele/kami"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
